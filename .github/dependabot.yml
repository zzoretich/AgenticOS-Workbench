# Keeps the commit-pinned GitHub Actions current (spec 2026-09-23-ci-safety-net-design D9): each update is a pull
# request that runs the full CI before anyone merges it. Minor and patch updates share one weekly pull request; each
# major version gets its own, so one breaking release never holds up the safe ones.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
