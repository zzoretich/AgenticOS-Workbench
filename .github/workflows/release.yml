name: release
on:
  push:
    tags: ["v*"]
# Build, then publish (spec 2026-09-23-ci-safety-net-design D8): only the publish job holds a write token, and it runs
# nothing from the repository; it attaches what the read-only build job produced. Actions are pinned to commit SHAs.
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      # Plan 4 Global Constraints narrowing of contract §5's `npm ci --ignore-scripts`: only the
      # plugin workspace is installed. tools/ (gate, bump-version, changelog) and cli/ are zero-dependency;
      # --ignore-scripts keeps node-pty's native build out of CI.
      - run: npm ci --ignore-scripts -w obsidian-plugin
      - name: Every version surface must equal the tag (enforced, not performed — see Plan 4 Global Constraints)
        run: node tools/bump-version.js "${GITHUB_REF_NAME#v}" --check
      - name: CHANGELOG.md has this version's section (the release notes)
        run: node tools/changelog.js check "${GITHUB_REF_NAME#v}"
      - run: npm run gate
      - run: npm run typecheck -w obsidian-plugin
      - run: npm test -w obsidian-plugin
      - run: npm run build -w obsidian-plugin
      - name: Release notes from CHANGELOG.md
        run: node tools/changelog.js notes "${GITHUB_REF_NAME#v}" > release-notes.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: |
            obsidian-plugin/main.js
            obsidian-plugin/manifest.json
            obsidian-plugin/styles.css
            release-notes.md
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: release
      - name: Publish the GitHub release with the Obsidian plugin bundle
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          files="release/obsidian-plugin/main.js release/obsidian-plugin/manifest.json release/obsidian-plugin/styles.css"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # a re-run: refresh the notes and replace the assets
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file release/release-notes.md
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber $files
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes-file release/release-notes.md $files
          fi
