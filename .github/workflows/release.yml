name: release
on:
  push:
    tags: ["v*"]
# Check, then publish (spec 2026-09-23-ci-safety-net-design D8): only the publish job holds a write token, and it runs
# nothing from the repository; it publishes the notes the read-only build job wrote. Actions are pinned to commit SHAs.
# The release carries no build of its own: the app (its DMG, the zip and blockmap the updater installs from, and
# latest-mac.yml) is signed, notarized and uploaded by `npm run release:app` on the maintainer's Mac (workbench-app D9),
# which needs this release to exist. The Obsidian plugin bundle is no longer built or attached (1.0, phase 6 R2–R3).
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      # Only the HUD's workspace is installed (its typecheck and tests). tools/ (gate, bump-version, changelog) and cli/
      # are zero-dependency, and nothing here needs an install script.
      - run: npm ci --ignore-scripts -w obsidian-plugin
      - name: Every version surface must equal the tag (enforced, not performed — see Plan 4 Global Constraints)
        run: node tools/bump-version.js "${GITHUB_REF_NAME#v}" --check
      - name: CHANGELOG.md has this version's section (the release notes)
        run: node tools/changelog.js check "${GITHUB_REF_NAME#v}"
      - run: npm run gate
      - run: npm run typecheck -w obsidian-plugin
      - run: npm test -w obsidian-plugin
      - name: Release notes from CHANGELOG.md
        run: node tools/changelog.js notes "${GITHUB_REF_NAME#v}" > release-notes.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: release-notes.md
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: release
      - name: Publish the GitHub release with its notes (release:app attaches the app)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # a re-run: refresh the notes only, never the assets release:app uploaded
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file release/release-notes.md
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes-file release/release-notes.md
          fi
