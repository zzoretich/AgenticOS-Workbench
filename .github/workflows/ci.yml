name: ci
on:
  push:
    branches: [main]
  pull_request:
# GITHUB_TOKEN is read-only for every job: nothing here pushes, comments, or publishes. A job that ever needs more
# scopes its own `permissions:` instead of widening this block.
permissions:
  contents: read
# A newer commit on the same ref supersedes an in-flight run; both jobs are side-effect free, so cancelling is safe.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run gate
      - run: node --test tools/*.test.js cli/*.test.js
      - run: npm test -w brain/scripts
      - run: npm test -w obsidian-plugin
  first-run:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - name: first-run rehearsal (aos init → scan → MCP recall → wrap_session → doctor → uninstall)
        run: sh cli/rehearsal/first-run.sh
