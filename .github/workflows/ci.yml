name: ci
on:
  push:
    branches: [main]
  pull_request:
# GITHUB_TOKEN is read-only for every job: nothing here pushes, comments, or publishes. A job that ever needs more
# scopes its own `permissions:` instead of widening this block.
permissions:
  contents: read
# Runs queue per ref. A newer push to a pull request supersedes its in-flight run (every job is side-effect free, so
# cancelling is safe); pushes to main are never cancelled, so every commit on main keeps its own pass/fail result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# Every action is pinned to a full commit SHA (the comment names its release); .github/dependabot.yml proposes updates.
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      # The privacy gate runs once, with the private terms, in privacy.yml. tools/test-env.js clears host variables
      # (the workspaces' own test scripts preload it too).
      - run: node --require ./tools/test-env.js --test tools/*.test.js cli/*.test.js
      - run: npm test -w brain/scripts
      - run: npm test -w obsidian-plugin
      - run: cd extras/cost && python3 -m unittest -v
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: eslint (the JavaScript)
        run: npm run lint
      - name: shellcheck (every tracked shell script, severity warning)
        run: |
          command -v shellcheck >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck; }
          npm run lint:sh
      - name: tsc (the HUD)
        run: npm run typecheck
      - name: CHANGELOG.md has a section for package.json's version
        run: node tools/changelog.js check current
  tz-env:
    # The whole suite in the two extreme time zones, with a developer's host variables exported: no test may assume
    # UTC or the machine's zone, and tools/test-env.js must clear every host variable (spec
    # 2026-09-23-ci-safety-net-design D4-D5).
    strategy:
      fail-fast: false
      matrix:
        tz: [Pacific/Kiritimati, Pacific/Pago_Pago]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: npm test (TZ=${{ matrix.tz }}, host variables exported)
        env:
          TZ: ${{ matrix.tz }}
          AOS_HOST: codex
          AOS_VAULT: ${{ runner.temp }}/not-a-vault
          AOS_CONFIG: ${{ runner.temp }}/agenticos.json
          BRAIN_AGENT_REDACT: "0"
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/claude
          CLAUDE_PROJECT_DIR: ${{ runner.temp }}
          CODEX_HOME: ${{ runner.temp }}/codex
        run: npm test
  first-run:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - name: first-run rehearsal (aos init → scan → MCP recall → wrap_session → doctor → uninstall)
        run: sh cli/rehearsal/first-run.sh
      - name: codex-host rehearsal (direct wiring → upgrade to the Codex plugin → plugin hooks and MCP run → doctor → uninstall)
        run: sh cli/rehearsal/codex-host.sh
  app:
    # The desktop app (app/, with its own lockfile, so the jobs above never install Electron): typecheck, unit tests,
    # the compat tripwire against obsidian-plugin/, then the build and the Playwright _electron suite over a synthetic
    # fixture vault. macOS only, like the app.
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - name: compat tripwire (every Obsidian API, DOM helper and icon the HUD uses exists in app/compat)
        run: npm run check:compat
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/electron
          key: electron-${{ runner.os }}-${{ hashFiles('app/package-lock.json') }}
      # The fixture vault's vendored runtime dependencies, keyed like app/scripts/make-fixture-vault.mjs keys them.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/tests/.cache
          key: fixture-deps-${{ runner.os }}-${{ hashFiles('brain/scripts/package.json') }}
      # Electron 44 fetches its binary on first use rather than at install.
      - run: node node_modules/electron/install.js
      - name: end-to-end (builds first)
        run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            app/playwright-report/
            app/test-results/
          retention-days: 7
