# The signed, notarized app (spec 2026-10-05-workbench-app-design D9). `npm run dist` builds it into dist/,
# `npm run dist:verify` checks it, `npm run smoke:packaged` runs the smoke build, and `npm run release:app` builds, signs,
# notarizes and uploads a release (phase 5, docs/superpowers/plans/2026-10-05-install-and-update.md).
appId: com.zzoretich.agenticos-workbench
productName: AgenticOS Workbench
artifactName: AgenticOS-Workbench-${version}-${arch}.${ext}
copyright: Copyright © 2026 AgenticOS Workbench contributors
directories:
  output: dist
  buildResources: build

# esbuild bundles the app and the HUD into out/. The one runtime dependency is node-pty, which the HUD loads with
# require() at run time: only its JavaScript and this Mac's prebuild ship.
files:
  - out/**/*
  - "!out/**/*.map"
  - package.json
  - "!node_modules/node-pty/{binding.gyp,deps,scripts,src,third_party,typings}{,/**/*}"
  - "!node_modules/node-pty/prebuilds/{darwin-x64,win32-arm64,win32-x64}{,/**/*}"
  - "!node_modules/node-pty/lib/**/*.{map,test.js}"
  - "!node_modules/node-pty/lib/{conpty_console_list_agent,windowsConoutConnection,windowsPtyAgent,windowsTerminal}.js"
  - "!node_modules/node-addon-api{,/**/*}"
# node-pty runs spawn-helper as a program, so it and pty.node live outside the archive (unixTerminal.js looks in
# app.asar.unpacked). Both are signed with the app.
asarUnpack:
  - node_modules/node-pty/prebuilds/darwin-arm64/*
# Phase 5 (I1): the runtime the app installs and upgrades from, a release tree scripts/make-payload.mjs builds. Plain
# files under Resources, sealed by the app's signature; the wizard runs its cli/aos.js with the user's own Node.
extraResources:
  - from: payload
    to: payload
# The N-API prebuild loads in this Electron as it is (docs/phase-0.md); a rebuild would compile it from source.
npmRebuild: false

mac:
  # The DMG is what people download; the zip is what the updater installs from (Squirrel.Mac takes a zip).
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  category: public.app-category.developer-tools
  icon: build/icon.png
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Notarizes the app when the keychain profile is set: APPLE_KEYCHAIN_PROFILE=aos-notary (docs/phase-3.md).
  notarize: true
  # The HUD is dark; let the window's frame and native dialogs follow the system as the dev build does.
  darkModeSupport: true
  extendInfo:
    NSAppleEventsUsageDescription: A command run in the terminal wants to control another app.

# The packaged app claims agenticos:// (src/main/protocol.ts); a dev run never does.
protocols:
  - name: AgenticOS link
    schemes: [agenticos]

dmg:
  # Signed here, then notarized and stapled by scripts/verify-dist.mjs --notarize-dmg.
  sign: true
  # The updater downloads the zip, so the DMG needs no blockmap.
  writeUpdateInfo: false

# Phase 5 (I6): the update feed is this repo's GitHub Releases. electron-builder writes app-update.yml into the app and
# latest-mac.yml beside the build; it never uploads (--publish never): scripts/release-app.mjs does, after the DMG is
# stapled.
publish:
  provider: github
  owner: zzoretich
  repo: AgenticOS-Workbench
  releaseType: release

electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
