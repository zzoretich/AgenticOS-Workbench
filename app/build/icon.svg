<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
<!-- The app icon: the UniDeX Line mark (spec D10), white on a black tile on the macOS icon grid.
     scripts/make-icon.cjs renders it to icon.png, which electron-builder turns into the app's .icns. -->
<defs>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
<feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.28"/>
</filter>
</defs>
<rect x="100" y="100" width="824" height="824" rx="185" fill="#0d0d0d" filter="url(#shadow)"/>
<!-- The mark's 130 × 46 drawing, scaled to 560 wide and centred on the tile. -->
<g transform="translate(232 413) scale(4.3077)" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
<path d="M6 6V26a14 14 0 0 0 28 0V6 M48 6V40H60a17 17 0 0 0 0-34H48Z M92 6L124 40 M124 6L92 40"/>
</g>
</svg>
